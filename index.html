<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16141f">
  <title>Lupus in Tabula</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <header>
      <div class="moon" aria-hidden="true"></div>
      <h1>Lupus in Tabula</h1>
      <p class="subtitle">Game companion</p>
    </header>

    <!-- Loading -->
    <section id="screen-loading" class="screen card center">
      <p class="muted">Connecting…</p>
    </section>

    <!-- Shown when firebase-config.js still has placeholder values -->
    <section id="screen-setup" class="screen card" hidden>
      <h2>Setup needed</h2>
      <p class="muted">Fill in <code>firebase-config.js</code> with your Firebase project's config. See the README.</p>
    </section>

    <!-- Home: create or join -->
    <section id="screen-home" class="screen card" hidden>
      <button id="btn-create" class="primary">Create a new lobby</button>
      <div class="divider"><span>or join one</span></div>
      <form id="form-join">
        <label for="input-code">Lobby code</label>
        <div class="row">
          <input id="input-code" maxlength="4" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" placeholder="ABCD" class="code-input">
          <button type="submit">Join</button>
        </div>
      </form>
      <p class="error" id="home-error"></p>
    </section>

    <!-- Profile: name + master -->
    <section id="screen-profile" class="screen card" hidden>
      <p class="lobby-tag">Lobby <strong class="code-label"></strong></p>
      <form id="form-profile">
        <label for="input-name">Your name</label>
        <input id="input-name" maxlength="20" autocomplete="nickname" placeholder="e.g. Marta">

        <label class="toggle">
          <input type="checkbox" id="input-master">
          <span class="toggle-ui" aria-hidden="true"></span>
          <span>
            I am the game master
            <small id="master-hint">The master narrates the game and doesn't play a role.</small>
          </span>
        </label>

        <button type="submit" class="primary" id="btn-profile-submit">Enter lobby</button>
        <button type="button" class="link" id="btn-profile-cancel">Back</button>
      </form>
      <p class="error" id="profile-error"></p>
    </section>

    <!-- Lobby -->
    <section id="screen-lobby" class="screen" hidden>
      <div class="card share" id="card-share">
        <p class="muted">Share this code with the other players</p>
        <button class="big-code code-label" id="btn-copy-code" title="Copy code"></button>
        <button id="btn-share" class="secondary">Share invite link</button>
        <p class="muted small" id="copy-feedback">&nbsp;</p>
      </div>

      <!-- Master, before the game: start button -->
      <div class="card" id="card-start" hidden>
        <button class="primary" id="btn-start">Start game</button>
        <p class="muted small center" id="start-hint"></p>
      </div>

      <!-- Players: waiting messages -->
      <div class="card center" id="card-wait" hidden>
        <p class="muted" id="wait-text"></p>
      </div>

      <!-- Master: choose how many of each role -->
      <div class="card" id="card-setup" hidden>
        <div class="list-head">
          <h2>Choose the roles</h2>
          <span class="count" id="setup-total"></span>
        </div>
        <p class="muted small" id="setup-suggestion"></p>
        <ul id="role-counters" class="plain-list"></ul>
        <p class="error" id="setup-error"></p>
        <button class="primary" id="btn-assign">Assign roles</button>
        <div class="row-buttons">
          <button class="link" id="btn-suggest">Use suggested</button>
          <button class="link danger" id="btn-cancel-setup">Cancel</button>
        </div>
      </div>

      <!-- Player: own role, hidden until tapped -->
      <div class="card" id="card-role" hidden>
        <button class="role-reveal" id="btn-reveal" aria-expanded="false">
          <span class="role-hidden">Tap to see your role<small>Make sure nobody is looking</small></span>
          <span class="role-shown">
            <span class="role-icon" id="role-icon"></span>
            <strong id="role-name"></strong>
            <span id="role-desc"></span>
            <span class="role-pack" id="role-pack"></span>
            <small>Tap again to hide</small>
          </span>
        </button>
        <p class="muted small center" id="game-counts"></p>
      </div>

      <!-- Master: everyone's role -->
      <div class="card" id="card-master-roles" hidden>
        <div class="list-head">
          <h2>Roles</h2>
          <span class="count" id="master-counts"></span>
        </div>
        <ul id="master-role-list" class="plain-list"></ul>
        <button class="link danger" id="btn-end-game">End game</button>
      </div>

      <div class="card" id="card-players">
        <div class="list-head">
          <h2>Players</h2>
          <span class="count" id="player-count"></span>
        </div>
        <ul id="player-list" class="plain-list"></ul>
        <p class="muted small" id="no-master">No game master yet.</p>
      </div>

      <div class="actions">
        <button class="secondary" id="btn-edit">Edit name / role</button>
        <button class="link danger" id="btn-leave">Leave lobby</button>
      </div>
    </section>

    <p id="conn-status" class="conn" hidden>Reconnecting…</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
