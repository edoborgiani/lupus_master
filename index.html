<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#16141f">
  <title>Lupus in Tabula</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="top-buttons">
    <button class="top-btn" id="btn-info" aria-haspopup="dialog"><img class="ri" src="icons/ui/book.svg" alt=""><span data-i18n="info"></span></button>
    <button class="top-btn" id="btn-settings" aria-haspopup="dialog" data-i18n-aria="settings" data-i18n-title="settings"><img class="ri" src="icons/ui/gear.svg" alt=""></button>
  </div>

  <main>
    <header>
      <div class="moon" aria-hidden="true"></div>
      <h1>Lupus in Tabula</h1>
      <p class="subtitle" data-i18n="subtitle">Il compagno di gioco</p>
    </header>

    <!-- Loading -->
    <section id="screen-loading" class="screen card center">
      <p class="muted" data-i18n="connecting">Connessione…</p>
    </section>

    <!-- Shown when firebase-config.js still has placeholder values -->
    <section id="screen-setup" class="screen card" hidden>
      <h2 data-i18n="setupTitle"></h2>
      <p class="muted" data-i18n="setupText"></p>
    </section>

    <!-- Home: create or join -->
    <section id="screen-home" class="screen card" hidden>
      <button id="btn-create" class="primary" data-i18n="create"></button>
      <div class="divider"><span data-i18n="orJoin"></span></div>
      <form id="form-join">
        <label for="input-code" data-i18n="roomCode"></label>
        <div class="row">
          <input id="input-code" maxlength="4" autocomplete="off" autocapitalize="characters"
                 spellcheck="false" placeholder="ABCD" class="code-input">
          <button type="submit" data-i18n="join"></button>
        </div>
      </form>
      <p class="error" id="home-error"></p>
    </section>

    <!-- Profile: name + master -->
    <section id="screen-profile" class="screen card" hidden>
      <p class="lobby-tag"><span data-i18n="room"></span> <strong class="code-label"></strong></p>
      <form id="form-profile">
        <label for="input-name" data-i18n="yourName"></label>
        <input id="input-name" maxlength="20" autocomplete="nickname" data-i18n-ph="namePlaceholder">

        <label class="toggle">
          <input type="checkbox" id="input-master">
          <span class="toggle-ui" aria-hidden="true"></span>
          <span>
            <span data-i18n="iAmMaster"></span>
            <small id="master-hint"></small>
          </span>
        </label>

        <button type="submit" class="primary" id="btn-profile-submit"></button>
        <button type="button" class="link" id="btn-profile-cancel"></button>
      </form>
      <p class="error" id="profile-error"></p>
    </section>

    <!-- Room -->
    <section id="screen-lobby" class="screen" hidden>
      <div class="card share" id="card-share">
        <p class="muted" data-i18n="shareCode"></p>
        <button class="big-code code-label" id="btn-copy-code" data-i18n-title="copyCode"></button>
        <button id="btn-share" class="secondary" data-i18n="shareLink"></button>
        <p class="muted small" id="copy-feedback">&nbsp;</p>
      </div>

      <!-- Whoever runs the game, before it starts: way of playing + start -->
      <div class="card" id="card-start" hidden>
        <h2 class="card-title" data-i18n="modeTitle"></h2>
        <div class="modes" role="radiogroup" data-i18n-aria="modeTitle">
          <label class="mode" id="mode-live">
            <input type="radio" name="mode" value="live">
            <span><strong><img class="ri" src="icons/ui/live.svg" alt=""><span data-i18n="modeLive"></span></strong><small data-i18n="modeLiveDesc"></small></span>
          </label>
          <label class="mode" id="mode-remote">
            <input type="radio" name="mode" value="remote">
            <span><strong><img class="ri" src="icons/ui/remote.svg" alt=""><span data-i18n="modeRemote"></span></strong><small data-i18n="modeRemoteDesc"></small></span>
          </label>
        </div>
        <button class="primary" id="btn-start" data-i18n="start"></button>
        <p class="muted small center" id="start-hint"></p>
      </div>

      <!-- Players: waiting messages -->
      <div class="card center" id="card-wait" hidden>
        <p class="muted" id="wait-text"></p>
        <p class="muted small" id="wait-mode"></p>
      </div>

      <!-- Roles to deal -->
      <div class="card" id="card-setup" hidden>
        <div class="list-head">
          <h2 data-i18n="prepare"></h2>
          <span class="count" id="setup-total"></span>
        </div>
        <p class="muted small" id="setup-mode"></p>
        <p class="muted small" id="setup-suggestion"></p>
        <ul id="role-counters" class="plain-list"></ul>
        <p class="error" id="setup-error"></p>
        <button class="primary" id="btn-assign" data-i18n="assign"></button>
        <div class="row-buttons">
          <button class="link" id="btn-suggest" data-i18n="useSuggested"></button>
          <button class="link danger" id="btn-cancel-setup" data-i18n="cancel"></button>
        </div>
      </div>

      <!-- Current phase (night, day, results), built by app.js -->
      <div class="card" id="card-phase" hidden></div>

      <!-- Player: own role, hidden until tapped -->
      <div class="card" id="card-role" hidden>
        <button class="role-reveal" id="btn-reveal" aria-expanded="false">
          <span class="role-hidden"><span data-i18n="tapToSee"></span><small data-i18n="nobodyLooking"></small></span>
          <span class="role-shown">
            <span class="role-icon" id="role-icon"></span>
            <strong id="role-name"></strong>
            <span id="role-desc"></span>
            <span class="role-pack" id="role-pack"></span>
            <small data-i18n="tapToHide"></small>
          </span>
        </button>
        <p class="muted small center" id="game-counts"></p>
      </div>

      <!-- Master: everyone's role -->
      <div class="card" id="card-master-roles" hidden>
        <div class="list-head">
          <h2 data-i18n="rolesTitle"></h2>
          <span class="count" id="master-counts"></span>
        </div>
        <ul id="master-role-list" class="plain-list"></ul>
        <button class="link danger" id="btn-end-game" data-i18n="endGame"></button>
      </div>

      <!-- History -->
      <div class="card" id="card-log" hidden>
        <h2 data-i18n="history"></h2>
        <ol id="game-log"></ol>
      </div>

      <div class="card" id="card-players">
        <div class="list-head">
          <h2 data-i18n="playersTitle"></h2>
          <span class="count" id="player-count"></span>
        </div>
        <ul id="player-list" class="plain-list"></ul>
        <p class="muted small" id="no-master"></p>
      </div>

      <div class="actions">
        <button class="secondary" id="btn-edit" data-i18n="editProfile"></button>
        <button class="link danger" id="btn-leave" data-i18n="leave"></button>
      </div>
    </section>

    <p id="conn-status" class="conn" hidden data-i18n="reconnecting"></p>
  </main>

  <!-- Settings: language (per phone) and the room's house rules -->
  <dialog id="settings" class="sheet" aria-labelledby="settings-title">
    <div class="sheet-head">
      <h2 id="settings-title"><img class="ri" src="icons/ui/gear.svg" alt=""><span data-i18n="settingsTitle"></span></h2>
      <button class="link close" id="btn-settings-close" data-i18n-aria="close">✕</button>
    </div>
    <div class="sheet-body">
      <h3 data-i18n="language"></h3>
      <div class="lang-switch" role="radiogroup" data-i18n-aria="language">
        <label class="lang"><input type="radio" name="lang" value="it"><span><img class="ri" src="icons/ui/flag-it.svg" alt=""> Italiano</span></label>
        <label class="lang"><input type="radio" name="lang" value="en"><span><img class="ri" src="icons/ui/flag-gb.svg" alt=""> English</span></label>
      </div>
      <h3 data-i18n="roomRules"></h3>
      <p class="muted small" id="rules-note"></p>
      <div id="rules-list"></div>
    </div>
  </dialog>

  <!-- Rules guide, one block per language -->
  <dialog id="info" class="sheet" aria-labelledby="info-title">
    <div class="sheet-head">
      <h2 id="info-title"><img class="ri" src="icons/ui/book.svg" alt=""><span data-lang="it">Regole del gioco</span><span data-lang="en">Game rules</span></h2>
      <button class="link close" id="btn-info-close" data-i18n-aria="close">✕</button>
    </div>

    <div class="sheet-body">
      <p class="guide-note" id="guide-note"></p>
      <div id="guide"></div>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>
